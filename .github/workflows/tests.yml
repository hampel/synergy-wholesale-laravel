name: Tests

on:
  push:
  pull_request:
  # A dormant package still needs to hear about a new PHP release. Note that
  # GitHub disables scheduled workflows after 60 days without repository
  # activity, and emails before it does.
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }}, Laravel ${{ matrix.laravel }} ${{ matrix.deps }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      # The corners of the supported range, not the whole matrix. Everything between
      # fails only when a corner does.
      #
      # One job per supported Laravel major, because a declared version that is never
      # resolved is an unbacked promise. The floor takes --prefer-lowest, which is the
      # only thing that ever resolves the dev toolchain low.
      #
      # Laravel 13 gets both ends of the PHP range: it runs on 8.3 through 8.5, so it
      # spans the range this package supports.
      matrix:
        include:
          - { php: '8.3', laravel: '^12.0', testbench: '^10.0', deps: '--prefer-lowest' }
          - { php: '8.3', laravel: '^13.0', testbench: '^11.0', deps: '' }
          - { php: '8.5', laravel: '^13.0', testbench: '^11.0', deps: '' }

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: soap
          coverage: none

      # --with, not `composer require`: it constrains within the declared range and
      # refuses to go outside it, so the matrix cannot drift away from composer.json
      # without the job failing. Testbench is pinned alongside because its majors track
      # Laravel's - Testbench 10 is Laravel 12, Testbench 11 is Laravel 13 - and letting
      # Composer choose would quietly test a different Laravel than the job claims.
      - run: >
          composer update
          --with="illuminate/support:${{ matrix.laravel }}"
          --with="orchestra/testbench:${{ matrix.testbench }}"
          --prefer-dist --no-progress ${{ matrix.deps }}

      - run: vendor/bin/phpunit

      # Also here, not only in a job of its own: phpstan.neon covers the whole 8.3 - 8.5
      # PHP range in one pass wherever it runs, but its result still depends on the
      # dependency tree it resolved against - including larastan's view of whichever
      # Laravel was installed, which is the whole reason this job varies it.
      - run: vendor/bin/phpstan analyse --no-progress

  dependencies:
    name: Declared dependencies
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          extensions: soap
          coverage: none

      # Analyse src/ with the dev dependencies gone, so anything it calls that is not in
      # "require" comes back as not-found. Nothing else catches this: a normal PHPStan run
      # has Testbench installed, which drags in the entire framework, so every Illuminate
      # class in the world resolves and nothing looks wrong.
      - run: composer install --no-dev --prefer-dist --no-progress

      # PHPStan is itself a dev dependency, so --no-dev just deleted it. It has to come
      # from outside the package. composer -d does not create the directory, so mkdir
      # first or the step dies with "Invalid working directory specified".
      - run: |
          mkdir -p /tmp/phpstan
          composer -d /tmp/phpstan require phpstan/phpstan --no-progress

      # -c is not optional. Without it PHPStan discovers the package's own phpstan.neon,
      # which points at tests/ and includes larastan - neither of which survives --no-dev -
      # turning the run into a configuration error while you are trying to read it as a
      # dependency result.
      - run: >
          /tmp/phpstan/vendor/bin/phpstan analyse
          -c .github/phpstan-nodev.neon
          --autoload-file=vendor/autoload.php --no-progress

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          extensions: soap
          coverage: none

      - run: composer validate --strict

      - run: composer install --prefer-dist --no-progress

      - run: vendor/bin/pint --test
